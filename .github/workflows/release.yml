# 自动发布：package.json 里的版本号变了并推到 main 时，自动打标签、打包、发布到 Releases 页面。
# 也可以推送 v 开头的标签，或者在 Actions 页面手动运行。
name: 发布新版本

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 看看这个版本发布过没有
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          DRAFT=$(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "v$V 已经发布过了，这次不用发布"
            echo "need=false" >> "$GITHUB_OUTPUT"
          else
            # 上次没发布成功留下的草稿，删掉重来
            if [ "$DRAFT" = "true" ]; then gh release delete "v$V" --yes; fi
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查语法
        run: node scripts/check.js

      - name: 装打包工具（不下载 Electron 本体）
        if: steps.ver.outputs.need == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: 打包
        if: steps.ver.outputs.need == 'true'
        run: node scripts/build.js all

      - name: 发布
        if: steps.ver.outputs.need == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 百宝匣 v${{ steps.ver.outputs.version }}
          body_path: docs/发布说明.md
          files: |
            dist/*.zip
            dist/*.bbupdate
            dist/*.html
