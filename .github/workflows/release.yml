# 推送 v 开头的标签（比如 v0.11.0）时，自动打包并发布到 Releases 页面
name: 发布新版本

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查语法
        run: node scripts/check.js

      - name: 装打包工具（不下载 Electron 本体）
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: 打包
        run: node scripts/build.js all

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 百宝匣 ${{ github.ref_name }}
          body_path: docs/发布说明.md
          files: |
            dist/*.zip
            dist/*.bbupdate

      - name: 手动运行时，把打好的包存成附件
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: 百宝匣
          path: |
            dist/*.zip
            dist/*.bbupdate
