<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
<style>@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.t1{animation:tw 3.2s ease-in-out infinite}.t2{animation:tw 4.6s ease-in-out 1.1s infinite}.t3{animation:tw 2.7s ease-in-out .6s infinite}
.t4{animation:tw 5.4s ease-in-out 2s infinite}.t5{animation:tw 3.9s ease-in-out 2.7s infinite}.t6{animation:tw 6.2s ease-in-out .3s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.n1{animation:breathe 14s ease-in-out infinite}.n2{animation:breathe 19s ease-in-out 4s infinite}
@keyframes milky{0%,100%{opacity:.45;transform:translateX(0)}50%{opacity:.85;transform:translateX(40px)}}
.mw{animation:milky 26s ease-in-out infinite}
@keyframes shoot{0%{transform:translateX(-180px);opacity:0}1%{opacity:1}7%{transform:translateX(620px);opacity:0}100%{transform:translateX(620px);opacity:0}}
.s1{animation:shoot 11s cubic-bezier(.3,.1,.6,1) 1s infinite}.s2{animation:shoot 17s cubic-bezier(.3,.1,.6,1) 6s infinite}.s3{animation:shoot 23s cubic-bezier(.3,.1,.6,1) 13s infinite}
@keyframes pole{0%,100%{opacity:.75}50%{opacity:1}}
.pole{animation:pole 4s ease-in-out infinite}
</style>
